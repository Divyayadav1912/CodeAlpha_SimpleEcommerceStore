
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopora | Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5ed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 340px;
            max-width: calc(100% - 60px);
            box-shadow: 0 4px 15px #00000015;
        }
        h1 { color: #285b42; text-align: center; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;

        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background: #285b42;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

/* Shopora Login Page */
body {
    font-family: Arial, sans-serif;
    background: #f5f5ed;
    color: #24392d;
}

form {
    background: #ffffff;
    border: 1px solid #e4e9e0;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 8px 28px rgba(36, 57, 45, 0.06);
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    border: 1px solid #dce3da;
    border-radius: 9px;
    margin-top: 6px;
    margin-bottom: 16px;
    font-size: 14px;
}

input:focus {
    outline: none;
    border-color: #285b42;
    box-shadow: 0 0 0 3px rgba(40, 91, 66, 0.10);
}

button {
    background: #285b42;
    color: #ffffff;
    border: none;
    border-radius: 9px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
}

button:hover {
    background: #1d4531;
}

a {
    color: #285b42;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

    </style>
</head>
<body>
    <div class="login-box">
        <h1>Welcome Back!</h1>
        <p>Login to your Shopora account.</p>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
<input type="hidden" name="next" value="{{ next }}">
            <input type="text" name="username"
                   placeholder="Username" required>
            <input type="password" name="password"
                   placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <p>Don't have an account?
            <a href="{% url 'signup' %}">Sign Up</a>
        </p>
    </div>
</body>
</html>
